repos:
  # Standard pre-commit checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: "Trim trailing whitespace"
      - id: end-of-file-fixer
        name: "Fix end of file"
      - id: check-yaml
        name: "Check YAML"
        args: ['--safe']
      - id: check-json
        name: "Check JSON"
      - id: check-toml
        name: "Check TOML"
      - id: check-merge-conflict
        name: "Check merge conflicts"
      - id: check-added-large-files
        name: "Check large files"
        args: ['--maxkb=1000']
      - id: detect-private-key
        name: "Detect private keys"

  # Python formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        name: "Format Python code (black)"
        language_version: python3.11
        files: '^RFSN_NPC_AI/Python/'
        exclude: '^RFSN_NPC_AI/Python/tests/fixtures/'

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "Sort imports (isort)"
        args: ['--profile', 'black']
        files: '^RFSN_NPC_AI/Python/'

  # Linting with Flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        name: "Lint Python code (flake8)"
        args: ['--max-line-length=120', '--extend-ignore=E203,W503', '--show-source']
        files: '^RFSN_NPC_AI/Python/'
        additional_dependencies: ['flake8-docstrings', 'flake8-bugbear']

  # Remove unused imports
  - repo: https://github.com/hadialqattan/pycln
    rev: v2.2.2
    hooks:
      - id: pycln
        name: "Remove unused imports (pycln)"
        args: ['--all']
        files: '^RFSN_NPC_AI/Python/'

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.5
    hooks:
      - id: shellcheck
        name: "Check shell scripts (shellcheck)"
        files: '^scripts/'
        args: ['--severity=warning']

  # Kubernetes YAML validation
  - repo: https://github.com/instrumenta/kubeval
    rev: 0.4.0
    hooks:
      - id: kubeval
        name: "Validate Kubernetes manifests"
        files: '^deployment/k8s/'
        args: ['--strict']

  # Dockerfile linting
  - repo: https://github.com/hadialqattan/dockerfilelint
    rev: v0.2.0
    hooks:
      - id: dockerfilelint
        name: "Lint Dockerfile"
        files: 'Dockerfile$'

  # Markdown linting (optional, comment out to disable)
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.17
    hooks:
      - id: mdformat
        name: "Format Markdown"
        args: ['--number']
        files: '\.md$'
        exclude: 'CHANGELOG.md|node_modules'

  # Git commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.12.0
    hooks:
      - id: commitizen
        name: "Check commit message format"
        stages: [commit-msg]
