apiVersion: v1
kind: Service
metadata:
  name: island-backend
  namespace: island
  labels:
    app: island-backend
spec:
  type: ClusterIP
  selector:
    app: island-backend
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  sessionAffinity: None
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: island-backend-network-policy
  namespace: island
spec:
  podSelector:
    matchLabels:
      app: island-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: island
    - podSelector:
        matchLabels:
          app: island-ingress
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 11434
    - protocol: TCP
      port: 443
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
