apiVersion: v1
kind: ConfigMap
metadata:
  name: island-backend-config
  namespace: island
data:
  config.json: |
    {
      "llm": {
        "backend": "ollama",
        "ollama_host": "http://ollama:11434",
        "ollama_model": "llama3.2",
        "temperature": 0.7,
        "max_tokens": 150
      },
      "tts": {
        "backend": "kokoro",
        "voice": "af_bella",
        "speed": 1.0,
        "max_queue_size": 10
      },
      "memory_enabled": true,
      "context_limit": 4,
      "server": {
        "host": "0.0.0.0",
        "port": 8000,
        "log_level": "info"
      },
      "performance": {
        "target_latency_ms": 1500,
        "backpressure_queue_size": 10
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: island-backend-env
  namespace: island
data:
  LOG_LEVEL: "INFO"
  PYTHONUNBUFFERED: "1"
  RFSN_ENV: "production"
