apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: island-backend-hpa
  namespace: island
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: island-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: island-backend-pdb
  namespace: island
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: island-backend
