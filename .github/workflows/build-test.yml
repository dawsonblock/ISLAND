name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: RFSN_NPC_AI/Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests
        working-directory: RFSN_NPC_AI/Python
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v3
        with:
          files: ./RFSN_NPC_AI/Python/coverage.xml
          flags: backend
          name: python-backend

  backend-docker:
    name: Python Backend Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: RFSN_NPC_AI
          file: RFSN_NPC_AI/Dockerfile
          push: false
          tags: island-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  style-advisory:
    name: Python Style Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        working-directory: RFSN_NPC_AI/Python
        run: |
          python -m pip install --upgrade pip
          pip install pylint black isort flake8

      - name: Report Python style status (advisory)
        working-directory: RFSN_NPC_AI/Python
        run: |
          set +e
          black --check .
          black_status=$?
          isort --check-only .
          isort_status=$?
          flake8 . --max-line-length=120 --extend-ignore=E203,W503
          flake8_status=$?
          set -e

          if [ $black_status -eq 0 ] && [ $isort_status -eq 0 ] && [ $flake8_status -eq 0 ]; then
            echo "Python style advisory: clean"
            exit 0
          fi

          if [ $black_status -ne 0 ]; then
            echo "::warning::black advisory found formatting drift."
          fi
          if [ $isort_status -ne 0 ]; then
            echo "::warning::isort advisory found import ordering drift."
          fi
          if [ $flake8_status -ne 0 ]; then
            echo "::warning::flake8 advisory found style violations."
          fi

          echo "Python style advisory reported issues. This job is informational and does not gate merges."

  proof-docs-advisory:
    name: Proof Docs Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Report proof-surface markdown status (advisory)
        run: |
          set +e
          npx markdownlint-cli2 \
            README.md \
            BUILD_STATE_REPORT.md \
            PROJECT_EXECUTION_SUMMARY.md \
            Docs/ai/current_backend_state.md \
            Docs/operations/test_matrix.md
          status=$?
          set -e

          if [ $status -eq 0 ]; then
            echo "Proof-surface markdown advisory: clean"
          else
            echo "::warning::Proof-surface markdown advisory found issues. This job is informational and does not gate merges."
          fi
